[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securerag"
version = "1.0.0"
description = "Security-Hardened Enterprise RAG System"
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (runtime dependencies only; pytest lives in the dev extra).
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "langgraph>=0.6,<1",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.4,<6",
    "pycryptodome>=3.22,<4",
    "bm25s>=0.2.6,<1",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "openai>=1.60,<2",
    "anthropic>=0.50,<1",
    "groq>=0.31,<1",
    "google-genai>=0.1,<2",
    "streamlit>=1.35,<2",
    "psutil>=5.9,<8",
    "pydantic-settings>=2.4,<3",
    "PyYAML>=6.0,<7",
    "pypdf>=4.0,<7",
    "python-docx>=1.1,<2",
    "beautifulsoup4>=4.12,<5",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.10,<2"]
dev = ["pytest>=8.3,<9", "qdrant-client>=1.10,<2"]

[tool.setuptools.packages.find]
include = ["securerag*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

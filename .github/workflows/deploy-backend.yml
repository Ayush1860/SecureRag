name: Deploy backend (Lambda)

# Builds the `lambda` image target, pushes it to ECR (tag = git SHA), updates the function, and
# smoke-tests every demo role on the Function URL. If the smoke test fails, it rolls back to the
# previous image.
#
# One-time setup (see deploy/aws/README.md):
#   repo variables: AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY_URI, LAMBDA_FUNCTION_NAME, FUNCTION_URL
#   repo secret:    DEMO_KEYS_JSON (plaintext demo keys from scripts/create_demo_keys.py)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "securerag/**"
      - "app/**"
      - "Dockerfile"
      - "requirements.txt"

permissions:
  id-token: write   # GitHub OIDC -> AWS, no stored AWS keys
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AES_KEY_PARAM: /securerag/aes_key_b64

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Anonymous pulls from public.ecr.aws (Lambda Web Adapter) share a quota across GitHub's runner IPs
      # and fail with 429 "Data limit exceeded"; authenticated pulls have their own, higher limit.
      - name: Log in to public.ecr.aws (ECR Public auth lives in us-east-1)
        run: |
          aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

      # ECR tags are immutable, so a second run for the same commit (push + manual dispatch) reuses
      # the image instead of failing on "tag already exists".
      - name: Check for an existing image of this commit
        id: existing
        run: |
          if aws ecr describe-images --repository-name "${ECR_URI##*/}" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"; echo "image for $GITHUB_SHA already in ECR; skipping build"
          fi
        env:
          ECR_URI: ${{ vars.ECR_REPOSITORY_URI }}

      - name: Build lambda image (AES key as a BuildKit secret, never in a layer)
        if: steps.existing.outputs.found != 'true'
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
        run: |
          umask 077
          aws ssm get-parameter --name "$AES_KEY_PARAM" --with-decryption \
            --query Parameter.Value --output text > "$RUNNER_TEMP/aes_key"
          echo "::add-mask::$(cat "$RUNNER_TEMP/aes_key")"
          # Lambda rejects image indexes, so no provenance/SBOM attestations.
          docker buildx build --target lambda --platform linux/amd64 \
            --provenance=false --sbom=false \
            --secret id=aes_key,src="$RUNNER_TEMP/aes_key" \
            -t "$IMAGE" --load .
          rm -f "$RUNNER_TEMP/aes_key"
          docker push "$IMAGE"

      - name: Update function (remember the previous image for rollback)
        id: update
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY_URI }}:${{ github.sha }}
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          # Bootstrap: before stack pass 2 the function doesn't exist yet. Pushing the image is the
          # whole job then (no local Docker needed for the first deploy).
          if ! aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "::notice::function $FUNCTION not found; image pushed, now run stack pass 2 with ImageUri=$IMAGE"
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREVIOUS=$(aws lambda get-function --function-name "$FUNCTION" --query Code.ImageUri --output text)
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$IMAGE" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          echo "deployed $IMAGE (previous: $PREVIOUS)"

      - name: Smoke test every demo role on the Function URL
        id: smoke
        if: steps.update.outputs.bootstrap != 'true'
        env:
          SMOKE_KEYS: ${{ secrets.DEMO_KEYS_JSON }}
        run: python3 scripts/smoke_api.py --base-url "${{ vars.FUNCTION_URL }}" --wait-ready 300

      - name: Roll back on failed smoke test
        if: failure() && steps.smoke.outcome == 'failure' && steps.update.outputs.previous != ''
        env:
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
          PREVIOUS: ${{ steps.update.outputs.previous }}
        run: |
          echo "smoke test failed; rolling back to $PREVIOUS"
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$PREVIOUS" >/dev/null
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          exit 1
